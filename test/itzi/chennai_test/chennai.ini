[time]
duration = 02:00:00
record_step = 00:05:00

[input]
dem = dem@itzi_chennai
friction = friction@itzi_chennai
rain = rain@itzi_chennai
bctype = bctype@itzi_chennai
bcval = bcval@itzi_chennai

[output]
prefix = itzi_chennai
values = water_depth, water_surface_elevation, v, vdir, qx, qy, mean_drainage_flow, volume_error

[statistics]
stats_file = itzi_chennai.csv

[options]
hmin = 0.005
dtmax = 5
cfl = 0.7
theta = 0.9
max_error = 0.05

[drainage]
swmm_inp = input/drainage.inp
output = drainage.csv

[grass]
grass_bin = grass
grassdata = /tmp/grassdata
location = itzi_chennai
mapset = PERMANENT
region = dem@itzi_chennai

